services:
  - type: web
    name: van-guard-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: 24.16.0

      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: DATABASE_PATH
        value: ./data/van-guard.sqlite

      - key: DATA_MODE
        value: demo

      - key: REQUEST_TIMEOUT_MS
        value: 10000

      - key: CORS_ORIGIN
        sync: false
